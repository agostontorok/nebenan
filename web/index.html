<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b192c" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="nähe — local calendars for the places you live in."
    />
    <title>nähe · local calendars</title>
    <style>
      :root {
        --pine: #0b192c;
        --paper: #fdfbf7;
        --coral: #ff5733;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: var(--paper);
        color: var(--pine);
      }
      .hub {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
      }
      .wordmark {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -1.8px;
        color: var(--pine);
      }
      .brand-mark {
        width: 34px;
        height: 38px;
        background: var(--pine);
        color: #fff;
        border-radius: 12px 12px 12px 2px;
        font-size: 30px;
        font-weight: 800;
        line-height: 36px;
        text-align: center;
        position: relative;
      }
      .brand-dot {
        font-size: 24px;
        color: var(--coral);
        position: absolute;
        top: -13px;
        right: -4px;
      }
      .tagline {
        margin: 0;
        color: #5a6779;
      }
      .cities {
        display: flex;
        gap: 14px;
        margin-top: 26px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .card {
        display: flex;
        align-items: center;
        padding: 16px 22px;
        border: 1px solid #dfe2e8;
        border-radius: 14px;
        background: #fff;
        color: var(--pine);
        text-decoration: none;
        font-weight: 700;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(11, 25, 44, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="hub">
      <p class="wordmark">
        <span class="brand-mark">n<span class="brand-dot">•</span></span>
        nähe
      </p>
      <p class="tagline">Local calendars for the places around you.</p>
      <div class="cities">
        <a class="card" href="darmstadt/">Darmstadt</a>
      </div>
    </div>
    <!-- Simple Analytics - 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
